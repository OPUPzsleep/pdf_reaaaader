name: Windows (instalador y pruebas)

on:
  push:
    branches: ['claude/**', 'main']
    # Una etiqueta «v1.2.3» compila y publica el instalador en Releases
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Comprobar tipos y pruebas unitarias
        run: |
          npm run typecheck
          npm test

      # Los instaladores descargados se guardan en caché para no repetir la descarga en cada ejecución
      - name: Carpeta de descargas
        shell: pwsh
        run: '"PDFREAAAADER_DESCARGAS=$env:RUNNER_TEMP\descargas" >> $env:GITHUB_ENV'

      - name: Restaurar descargas en caché
        id: cache-descargas
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\descargas
          key: descargas-v1

      # Cada programa en su paso, con límite de tiempo, para ver dónde se atasca algo (los logs solo se ven al terminar el paso)
      - name: Descargar el modelo para quitar fondos
        timeout-minutes: 10
        run: npm run fetch-binaries -- -Solo modelo

      - name: Descargar Real-ESRGAN
        timeout-minutes: 10
        run: npm run fetch-binaries -- -Solo realesrgan

      - name: Descargar Ghostscript
        timeout-minutes: 10
        run: npm run fetch-binaries -- -Solo ghostscript

      - name: Guardar descargas en caché
        if: steps.cache-descargas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\descargas
          key: descargas-v1

      - name: Compilar instalador y versión portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Pruebas de humo de la app empaquetada
        shell: pwsh
        run: |
          $env:PDFREAAAADER_EXE = (Resolve-Path 'release\win-unpacked\pdfreaaaader.exe').Path
          npx playwright test tests/e2e/empaquetada.spec.ts

      - name: Listar resultados
        if: always()
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Publicar el instalador en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archivos = (Get-ChildItem release -Filter *.exe -File).FullName
          $notas = @"
          Instalador y versión portable para Windows 10/11 (64 bits). Funciona sin conexión.

          - **pdfreaaaader-Setup-*.exe**: instalador (NSIS).
          - **pdfreaaaader-Portable-*.exe**: versión portable, sin instalar.

          El instalador no está firmado: Windows SmartScreen puede avisar la primera vez («Más información» → «Ejecutar de todas formas»).
          "@
          gh release create $env:GITHUB_REF_NAME $archivos --title "pdfreaaaader $env:GITHUB_REF_NAME" --notes $notas

      - uses: actions/upload-artifact@v4
        with:
          name: pdfreaaaader-windows
          path: |
            release/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-y-resultados
          path: |
            tests/capturas/
            test-results/
          if-no-files-found: ignore
